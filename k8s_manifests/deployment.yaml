apiVersion: apps/v1
kind: Deployment
metadata:
  name: aiops-copilot-deployment
  namespace: default
  labels:
    app.kubernetes.io/name: aiops-copilot
    app.kubernetes.io/component: backend-engine
spec:
  replicas: 2
  selector:
    matchLabels:
      app: aiops-copilot
  template:
    metadata:
      labels:
        app: aiops-copilot
    spec:
      containers:
      - name: aiops-copilot-container
        image: farahbenchikha/aiops-copilot:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8000
          name: http
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /api/health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        envFrom:
        - configMapRef:
            name: aiops-copilot-config
